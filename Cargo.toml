[package]
name = "projgeom-rs"
version = "0.1.6"
edition = "2021"
rust-version = "1.70"
description = "Projective Geometry in Rust"
repository = "https://github.com/luk036/projgeom-rs"
license = "MIT"
keywords = ["geometry", "projective", "mathematics", "elliptic", "hyperbolic"]
categories = ["mathematics", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "src/doc-header.html"]

[dependencies]
num-integer = { version = "0.1.46" }
# fraction = { version = "0.1.1" }
# fractions-rs = { git = "https://github.com/luk036/fractions-rs" }
fractions-rs = { version = "0.1.7" }
svgbobdoc = { version = "0.3", features = ["enable"] }


[dev-dependencies]
proptest = "1"
criterion = "0.8.2"

[[bench]]
name = "geometry_bench"
harness = false
